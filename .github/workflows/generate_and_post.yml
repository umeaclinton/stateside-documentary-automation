name: YouTube Shorts Auto-Pilot Pipeline

on:
  schedule:
    # Runs daily at 14:00 UTC (9:00 AM EST)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional specific topic for the Short'
        required: false
        default: ''
      skip_upload:
        description: 'Skip uploading to YouTube (test render only)'
        type: boolean
        default: false
      privacy:
        description: 'YouTube Privacy Status'
        required: true
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public

jobs:
  build-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube OAuth Credentials from Secrets
        if: ${{ env.YOUTUBE_OAUTH_TOKEN_JSON != '' }}
        run: |
          echo "${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}" > oauth_token.json
          echo "${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}" > client_secret.json
        env:
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}

      - name: Execute Autonomous Video Creation & Posting
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CONTENT_NICHE: ${{ vars.CONTENT_NICHE || 'Psychology & Human Behavior' }}
          VOICE_NAME: ${{ vars.VOICE_NAME || 'en-US-ChristopherNeural' }}
          YOUTUBE_PRIVACY_STATUS: ${{ github.event.inputs.privacy || vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
        run: |
          CMD="python main.py"
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            CMD="$CMD --skip-upload"
          fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            CMD="$CMD --topic \"${{ github.event.inputs.topic }}\""
          fi
          echo "Running command: $CMD"
          eval $CMD

      - name: Upload Generated Videos & Scripts Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts-${{ github.run_id }}
          path: output/
          retention-days: 7

name: Stateside Autonomous Documentary Pipeline

on:
  repository_dispatch:
    types: [run-daily-essay]
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic key, custom prompt, or "auto" for autonomous selection'
        required: false
        default: 'auto'
      scenes:
        description: 'Number of scenes (default 80 for 7-10 min documentary)'
        required: false
        default: '80'
      upload_to_youtube:
        description: 'Publish video directly to YouTube'
        type: boolean
        default: true

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Standard Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube Credentials from Secrets
        env:
          YOUTUBE_OAUTH_TOKEN_JSON: ${{ secrets.YOUTUBE_OAUTH_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: |
          python3 -c "
          import os, json
          oauth = os.environ.get('YOUTUBE_OAUTH_TOKEN_JSON', '').strip()
          client = os.environ.get('YOUTUBE_CLIENT_SECRET_JSON', '').strip()
          if oauth:
              json.loads(oauth)
              with open('oauth_token.json', 'w', encoding='utf-8') as f:
                  f.write(oauth)
              print('[Auth] Restored and validated oauth_token.json')
          if client:
              json.loads(client)
              with open('client_secret.json', 'w', encoding='utf-8') as f:
                  f.write(client)
              print('[Auth] Restored and validated client_secret.json')
          "

      - name: Run Masterpiece Video Essay Production & Publishing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_NAME: "Stateside"
          CHANNEL_HANDLE: "@50kstateside"
        run: |
          TOPIC="${{ github.event.inputs.topic || github.event.client_payload.topic || 'auto' }}"
          SCENES="${{ github.event.inputs.scenes || github.event.client_payload.scenes || '80' }}"
          CMD="python essay_stuff/generate_essay.py --topic \"$TOPIC\" --scenes \"$SCENES\""
          
          if [ -f "oauth_token.json" ] && [ "${{ github.event.inputs.upload_to_youtube }}" != "false" ]; then
            CMD="$CMD --upload"
          fi
          
          echo "Executing: $CMD"
          eval $CMD

      - name: Commit and Push Posted History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted_history.json || true
          git commit -m "chore: record produced topic in history [skip ci]" || echo "No history changes to commit"
          git push || echo "Nothing to push"

      - name: Upload Master Artifacts (Video, Thumbnail, Metadata)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateside-production-${{ github.run_id }}
          path: output/essays/
          retention-days: 7
